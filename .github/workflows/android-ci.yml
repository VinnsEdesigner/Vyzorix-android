name: android-ci

# The modules this repo actually has are :android-core, :cloud-connector and :app
# (see settings.gradle.kts). An earlier revision of this workflow built
# :core:common, :core:data, :core:services and :core:audioengine, which are not
# modules here — every one of those jobs failed with "project 'core' not found",
# which reads as a build break rather than as a stale workflow.

on:
  pull_request:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'android-core/**'
      - 'cloud-connector/**'
      - 'app/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'android-core/**'
      - 'cloud-connector/**'
      - 'app/**'
      - '.github/workflows/android-ci.yml'

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-core:
    name: android-core — native build + JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          # The NDK + CMake versions match android-core/build.gradle.kts
          # (`ndkVersion` and the CMake spec). Bumping either requires updating both
          # this manifest and the gradle file.
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools ndk;26.3.11579264 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble (runs externalNativeBuild)
        run: ./gradlew :android-core:assembleDebug --no-daemon --stacktrace

      - name: Test
        run: ./gradlew :android-core:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-core-test-report
          path: android-core/build/reports/tests/testDebugUnitTest

  cloud-connector:
    name: cloud-connector — assemble + JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew :cloud-connector:assembleDebug --no-daemon --stacktrace

      - name: Test
        run: ./gradlew :cloud-connector:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-connector-test-report
          path: cloud-connector/build/reports/tests/testDebugUnitTest

  app:
    name: app — assembleDebug + JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          # NDK + CMake required because :app transitively pulls in :android-core,
          # which has an external native build.
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools ndk;26.3.11579264 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Test
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report
          path: app/build/reports/tests/testDebugUnitTest

  gate:
    name: gate — ktlint + detekt + dead code + unit tests + native gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools ndk;26.3.11579264 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The same task AGENTS.md tells every contributor to run before committing.
      - name: Run the gate
        run: ./gradlew gate --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-test-report
          path: '**/build/reports/tests/testDebugUnitTest'
