[versions]
# Build tooling
agp = "8.3.2"
kotlin = "1.9.23"
ksp = "1.9.23-1.0.20"
ktlint = "12.1.1"
detekt = "1.23.6"

# Kotlin libs
kotlinx-coroutines = "1.8.0"
kotlinx-serialization = "1.6.3"
kotlin-test = "1.9.23"

# Android SDK levels.
#
# targetSdk is pinned at 28 deliberately and must not be raised. Android 10
# denies execve() on files inside an app's home directory for any app targeting
# API 29+, and the Debian engine execs binaries from app storage. The kernel
# enforces this through SELinux (seapp_contexts maps targetSdk >= 29 to
# untrusted_app_29, which lacks the exec rule untrusted_app_27 has), so there is
# no userspace workaround. Termux pins 28 for the same reason.
#
# Consequences: no Play Store distribution (Play requires a recent API level),
# and the app carries the "built for an older Android" install notice. Both are
# accepted. See doc/ANDROID_SERVICE_ARCHITECTURE.md §1.1.
#
# compileSdk stays high so the code can compile against modern APIs.
#
# minSdk is 26 because that is the floor the code actually has: the PTY reader and
# session registry use ConcurrentHashMap.compute/computeIfPresent (API 24) and
# Process.waitFor(timeout)/destroyForcibly (API 26). It was declared 23 for a while,
# which was never true — lint's NewApi check found seven unguarded calls that would
# have thrown NoSuchMethodError on a 23 device. The fleet is Android 13, so raising
# the floor excludes nothing and makes the declaration honest rather than guarding
# seven call sites to support an OS nothing runs.
android-compileSdk = "34"
android-minSdk = "26"
android-targetSdk = "28"

# AndroidX
androidx-annotation = "1.7.1"
androidx-core-ktx = "1.13.1"
androidx-datastore = "1.1.1"
androidx-lifecycle = "2.7.0"

# SQLCipher — full-DB encryption per ADR-0004
sqlcipher-android = "4.5.6"

# Cloud connector. OkHttp for HTTP + WebSocket; libv (the vyzorix.v format) is
# consumed as a published artifact rather than vendored, so the device and the
# server cannot drift on the canonical string a signature covers.
okhttp = "4.12.0"
libv = "1.0.0"

# JVM/Robolectric test stack
robolectric = "4.12.2"
junit4 = "4.13.2"
androidx-test-core = "1.5.0"
androidx-test-ext-junit = "1.1.5"

[libraries]
# Kotlin
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin-test" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin-test" }

# AndroidX
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidx-lifecycle" }

# SQLCipher
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher-android" }

# Cloud connector
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
# Published from VinnsEdesigner/libv via JitPack. Group is the JitPack coordinates,
# not the source package (com.vyzorix.libv).
libv = { module = "com.github.VinnsEdesigner.libv:libv", version.ref = "libv" }

# Test
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
